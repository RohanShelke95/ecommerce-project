spring.application.name=ecommerce
server.port=5454

#db specific properties (H2 file-based so data survives restarts)
# AUTO_SERVER=TRUE allows DevTools restarts and avoids "database already in use" lock errors
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ecommercedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#ORM s/w specific properties
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

razorpay.api.key=${RAZORPAY_API_KEY:rzp_test_T8EF3wxS1CmLRb}
razorpay.api.secret=${RAZORPAY_API_SECRET:XUNnSEvZIJHlo5yHO6v63UMJ}

# Email configurations
spring.mail.host=smtp.gmail.com
spring.mail.port=587
